<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendrier de l'Avent</title>
<style>
  :root {
    --nuit-1: #0b1626;
    --nuit-2: #14304a;
    --or: #f0cf7a;
    --or-fonce: #b88a2c;
    --rouge: #9e3b3b;
    --vert: #1f5240;
    --bleu: #24476b;
    --texte: #f4efe4;
    --serif: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at 50% 0%, var(--nuit-2) 0%, var(--nuit-1) 70%) fixed;
  }
  #neige {
    position: fixed; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
  }
  main {
    position: relative; z-index: 1;
    max-width: 980px; margin: 0 auto;
    padding: 2rem 1rem 3rem;
  }
  header { text-align: center; margin-bottom: 1.6rem; }
  h1 {
    font-family: var(--serif);
    font-size: clamp(1.9rem, 6vw, 3.2rem);
    margin: 0 0 .3rem;
    color: var(--or);
    letter-spacing: .02em;
  }
  #sous-titre { margin: 0; opacity: .85; font-size: 1.05rem; }
  #compte {
    display: inline-block;
    margin: 1.1rem 0 0;
    padding: .45rem 1rem;
    border: 1px solid rgba(240,207,122,.4);
    border-radius: 999px;
    background: rgba(255,255,255,.05);
    font-size: .95rem;
  }
  #bandeau-test {
    display: none;
    margin: .8rem auto 0; max-width: 34rem;
    padding: .4rem .8rem; border-radius: 8px;
    background: rgba(240,207,122,.15); color: var(--or);
    font-size: .85rem;
  }

  /* ---------- Grille de portes ---------- */
  #grille {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: .7rem;
  }
  @media (min-width: 760px) {
    #grille { grid-template-columns: repeat(6, 1fr); gap: .95rem; }
  }
  .porte {
    position: relative;
    aspect-ratio: 1 / 1.08;
    padding: 0; border: 0; background: none;
    font: inherit; color: inherit;
    cursor: pointer;
    perspective: 700px;
    -webkit-tap-highlight-color: transparent;
  }
  .interieur {
    position: absolute; inset: 0;
    border-radius: 10px;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 60%, #fff3c4 0%, var(--or) 55%, var(--or-fonce) 100%);
    box-shadow: inset 0 0 18px rgba(0,0,0,.5);
    color: #6b4300;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
  }
  .battant {
    position: absolute; inset: 0;
    border-radius: 10px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, var(--c1), var(--c2));
    border: 2px solid rgba(240,207,122,.55);
    box-shadow: 0 4px 10px rgba(0,0,0,.35), inset 0 0 0 4px rgba(255,255,255,.06);
    transform-origin: left center;
    transition: transform .8s cubic-bezier(.2,.8,.2,1), filter .3s;
    backface-visibility: hidden;
  }
  .c0 { --c1: #b04848; --c2: var(--rouge); }
  .c1 { --c1: #2c7058; --c2: var(--vert); }
  .c2 { --c1: #345f8a; --c2: var(--bleu); }
  .num {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(1.5rem, 5.5vw, 2.4rem);
    color: var(--or);
    text-shadow: 0 2px 4px rgba(0,0,0,.4);
  }
  .cadenas {
    position: absolute; right: 8%; bottom: 8%;
    width: 1.1rem; height: 1.1rem; opacity: .0;
    fill: var(--or);
  }
  .porte.verrouillee .battant { filter: saturate(.45) brightness(.7); }
  .porte.verrouillee .cadenas { opacity: .85; }
  .porte.dispo .battant { animation: lueur 2.4s ease-in-out infinite; }
  .porte.ouverte .battant { transform: rotateY(-115deg); animation: none; }
  .porte:hover:not(.verrouillee):not(.ouverte) .battant { transform: rotateY(-14deg); }
  .porte:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; border-radius: 12px; }
  .porte.secoue { animation: secoue .45s; }

  @keyframes lueur {
    0%, 100% { box-shadow: 0 4px 10px rgba(0,0,0,.35), 0 0 0 0 rgba(240,207,122,.0); }
    50% { box-shadow: 0 4px 10px rgba(0,0,0,.35), 0 0 18px 4px rgba(240,207,122,.55); }
  }
  @keyframes secoue {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }

  /* ---------- Message temporaire ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 1.4rem; z-index: 20;
    transform: translate(-50%, 140%);
    max-width: min(92vw, 28rem);
    padding: .7rem 1.1rem;
    border-radius: 12px;
    background: #0b1626; color: var(--texte);
    border: 1px solid rgba(240,207,122,.55);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    text-align: center; font-size: .95rem;
    transition: transform .35s ease;
  }
  #toast.visible { transform: translate(-50%, 0); }

  /* ---------- Fenêtre de contenu ---------- */
  dialog {
    width: min(92vw, 34rem);
    max-height: 88vh;
    overflow: auto;
    padding: 1.4rem 1.4rem 1.6rem;
    border: 1px solid rgba(240,207,122,.55);
    border-radius: 16px;
    background: linear-gradient(160deg, #17324d, #0d1a2b);
    color: var(--texte);
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  dialog::backdrop { background: rgba(3,8,16,.72); backdrop-filter: blur(3px); }
  .modal-jour {
    font-family: var(--serif); color: var(--or);
    font-size: .95rem; letter-spacing: .12em; text-transform: uppercase;
    margin: 0 0 .2rem;
  }
  dialog h2 { font-family: var(--serif); margin: 0 0 .9rem; font-size: 1.6rem; color: #fff; }
  #modal-corps p { white-space: pre-line; line-height: 1.6; margin: .4rem 0 1rem; font-size: 1.05rem; }
  #modal-corps img, #modal-corps iframe {
    display: block; width: 100%; border: 0; border-radius: 10px; margin: 0 0 .9rem;
  }
  #modal-corps iframe { aspect-ratio: 16 / 9; }
  #modal-corps a.lien {
    display: inline-block; padding: .55rem 1rem; border-radius: 999px;
    background: var(--or); color: #3a2600; font-weight: 600; text-decoration: none;
  }
  #modal-corps a.lien:hover { filter: brightness(1.08); }
  .fermer {
    position: absolute; top: .6rem; right: .7rem;
    width: 2.2rem; height: 2.2rem; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.08); color: #fff;
    font-size: 1.2rem; cursor: pointer;
  }
  .fermer:hover { background: rgba(255,255,255,.18); }
  .fermer:focus-visible { outline: 3px solid var(--or); }

  footer { text-align: center; margin-top: 2rem; font-size: .8rem; opacity: .55; }

  @media (prefers-reduced-motion: reduce) {
    .battant, #toast { transition-duration: .01s; }
    .porte.dispo .battant, .porte.secoue { animation: none; }
  }
</style>
</head>
<body>
<canvas id="neige" aria-hidden="true"></canvas>

<main>
  <header>
    <h1 id="titre"></h1>
    <p id="sous-titre"></p>
    <p id="compte" aria-live="off"></p>
    <div id="bandeau-test"></div>
  </header>
  <section id="grille" aria-label="Les 24 portes du calendrier"></section>
  <footer id="pied"></footer>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="modal" aria-labelledby="modal-titre">
  <button class="fermer" id="fermer" aria-label="Fermer">&#10005;</button>
  <p class="modal-jour" id="modal-jour"></p>
  <h2 id="modal-titre"></h2>
  <div id="modal-corps"></div>
</dialog>

<script>
/* =====================================================================
   1) RÉGLAGES — c'est ici que tu personnalises le calendrier
   ===================================================================== */
const CONFIG = {
  titre: "Calendrier de l'Avent à Cutips",
  sousTitre: "24 petites surprises avant Noël",
  pied: "Une porte s'ouvre chaque jour à minuit, heure de ton appareil.",
  annee: 2026,          // année du calendrier (portes du 1er au 24 décembre)
  melanger: true,       // true = portes dans le désordre (comme un vrai calendrier)
  graine: 7,            // change ce nombre pour obtenir un autre désordre
  autoriserTest: true   // true = permet ?date=2026-12-10 dans l'adresse (voir mode test)
};

/* =====================================================================
   2) CONTENU DES 24 PORTES
   Pour chaque jour, tu peux remplir :
     titre : le titre affiché
     texte : le message (les retours à la ligne sont conservés)
     image : adresse d'une image (https://...)  — optionnel
     alt   : description de l'image               — optionnel
     video : identifiant YouTube, ex. "dQw4w9WgXcQ" — optionnel
     lien  : { url: "https://...", texte: "Voir" }  — optionnel
   Exemple complet :
     { titre: "Ma chanson", texte: "Écoute ça !",
       video: "XXXXXXXXXXX",
       lien: { url: "https://exemple.com", texte: "En savoir plus" } }
   ===================================================================== */
const JOURS = [
  /*  1 */ { titre: "Bienvenue !", texte: "Chaque jour, une porte s'ouvre. Pour commencer, prends une minute pour respirer et penser à quelqu'un que tu aimes... Moi mettons ? J'accepte si c'est beuhbé et Merlino :3" },
  /*  2 */ { titre: "Je t'aime parce que...", texte: "Tu arrives à me calmer dans mes moments plus difficile" },
  /*  3 */ { titre: "Une chanson", texte: "Le voici pour toi : https://www.youtube.com/watch?v=O-aavAlSYgc" },
  /*  4 */ { titre: "Un petit mot", texte: "Comment je veux te regarder pour le restant de ma vie.", images: "images/jour04.jpg" },
  /*  5 */ { titre: "Dehors", texte: "Sors marcher dix minutes, même s'il fait froid. Habille-toi bien Cutips!" },
  /*  6 */ { titre: "Souvenir", texte: "Retrouve une vieille photo qui te fait sourire." },
  /*  7 */ { titre: "Réconfort", texte: "Cuisine ou commande un plat réconfortant pour ce soir." },
  /*  8 */ { titre: "Je t'aime parce que...", texte: "Avec toi on peut être supra excité pour des cartes pokémon", images: "images/Jour08.jpg", alt: "Ce tin à ce prix c'était du vol!" },
  /*  9 */ { titre: "Lecture", texte: "Lis quelques pages d'un livre que tu avais mis de côté." },
  /* 10 */ { titre: "Trois choses", texte: "Note trois choses qui t'ont fait du bien aujourd'hui." },
  /* 11 */ { titre: "Un appel", texte: "Appelle quelqu'un que tu n'as pas entendu depuis longtemps." },
  /* 12 */ { titre: "Un peu de déco", texte: "Ajoute une petite décoration chez toi : lumières, branche, bougie." },
  /* 13 */ { titre: "Soirée film", texte: "Choisis un film pour ce soir. Couverture obligatoire." },
  /* 14 */ { titre: "Étirements", texte: "Cinq minutes d'étirements pour bien finir la journée." },
  /* 15 */ { titre: "Gribouillis", texte: "Dessine ou gribouille dix minutes, sans te juger." },
  /* 16 */ { titre: "Mikwetc Cutips", texte: "Tu te souviens de mon texte secret ? Le voici : https://docs.google.com/document/d/1QwxV6Hd6CVgOkLW4ylzBQ0jIlTpCqCjHR1quZMewvZM/edit?usp=sharing" },
  /* 17 */ { titre: "Gâterie", texte: "Offre-toi une petite gâterie. Tu l'as bien méritée." },
  /* 18 */ { titre: "Le ciel", texte: "Regarde le ciel un moment, de jour comme de nuit." },
  /* 19 */ { titre: "Playlist", texte: "Crée une playlist pour les fêtes et partage-la." },
  /* 20 */ { titre: "Une carte", texte: "Écris une carte à la main pour quelqu'un." },
  /* 21 */ { titre: "Solstice", texte: "Autour du 21 décembre, c'est le solstice d'hiver : à partir de maintenant, les jours rallongent. Allume une bougie ou des lumières." },
  /* 22 */ { titre: "Partager", texte: "Partage une recette ou un livre que tu aimes." },
  /* 23 */ { titre: "Vraie pause", texte: "Prévois trente minutes sans rien d'autre à faire. Vraiment rien." },
  /* 24 */ { titre: "Joyeuses fêtes !", texte: "La dernière porte. Merci d'avoir ouvert celles de tous les jours. Prends soin de toi et des tiens." }
];

/* =====================================================================
   3) LOGIQUE — normalement, pas besoin d'y toucher
   ===================================================================== */
(function () {
  "use strict";

  var NB = 24;
  var MOIS_DECEMBRE = 11;
  var grille = document.getElementById("grille");
  var compte = document.getElementById("compte");
  var toast = document.getElementById("toast");
  var modal = document.getElementById("modal");
  var formatDate = new Intl.DateTimeFormat("fr-CA", { day: "numeric", month: "long" });

  document.title = CONFIG.titre;
  document.getElementById("titre").textContent = CONFIG.titre;
  document.getElementById("sous-titre").textContent = CONFIG.sousTitre;
  document.getElementById("pied").textContent = CONFIG.pied;

  /* ---------- Date du jour (avec mode test éventuel) ---------- */
  var decalage = 0; // millisecondes à ajouter à l'horloge de l'appareil
  if (CONFIG.autoriserTest) {
    try {
      var p = new URLSearchParams(location.search).get("date");
      if (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) {
        var t = p.split("-").map(Number);
        var simulee = new Date(t[0], t[1] - 1, t[2], 12, 0, 0);
        decalage = simulee.getTime() - Date.now();
        var bandeau = document.getElementById("bandeau-test");
        bandeau.style.display = "block";
        bandeau.textContent = "Mode test : date simulée au " + p + ".";
      }
    } catch (e) { /* on ignore */ }
  }
  function maintenant() { return new Date(Date.now() + decalage); }
  function dateOuverture(jour) { return new Date(CONFIG.annee, MOIS_DECEMBRE, jour, 0, 0, 0); }
  function estOuvrable(jour) { return maintenant().getTime() >= dateOuverture(jour).getTime(); }

  /* ---------- Mémoire des portes déjà ouvertes (facultative) ---------- */
  var cle = "calendrier-avent-" + CONFIG.annee;
  var dejaOuvertes = [];
  try {
    var brut = localStorage.getItem(cle);
    if (brut) dejaOuvertes = JSON.parse(brut).filter(Number.isInteger);
  } catch (e) { dejaOuvertes = []; }
  function memoriser(jour) {
    if (dejaOuvertes.indexOf(jour) === -1) dejaOuvertes.push(jour);
    try { localStorage.setItem(cle, JSON.stringify(dejaOuvertes)); } catch (e) { /* ignoré */ }
  }

  /* ---------- Ordre des portes ---------- */
  function generateur(graine) {
    var a = graine >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var ordre = [];
  for (var i = 1; i <= NB; i++) ordre.push(i);
  if (CONFIG.melanger) {
    var rnd = generateur(CONFIG.graine);
    for (var k = ordre.length - 1; k > 0; k--) {
      var r = Math.floor(rnd() * (k + 1));
      var tmp = ordre[k]; ordre[k] = ordre[r]; ordre[r] = tmp;
    }
  }

  /* ---------- Construction des portes ---------- */
  var SVG_CADENAS = '<svg class="cadenas" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2zM9 7a3 3 0 0 1 6 0v2H9V7z"/></svg>';
  var boutons = {};

  ordre.forEach(function (jour) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "porte c" + (jour % 3);
    b.dataset.jour = String(jour);
    b.innerHTML = '<span class="interieur" aria-hidden="true">&#10022;</span>' +
                  '<span class="battant"><span class="num">' + jour + '</span>' + SVG_CADENAS + '</span>';
    b.addEventListener("click", function () { cliquer(jour); });
    grille.appendChild(b);
    boutons[jour] = b;
  });

  function majEtats() {
    for (var jour = 1; jour <= NB; jour++) {
      var b = boutons[jour];
      var ouvrable = estOuvrable(jour);
      var ouverte = ouvrable && dejaOuvertes.indexOf(jour) !== -1;
      b.classList.toggle("verrouillee", !ouvrable);
      b.classList.toggle("dispo", ouvrable && !ouverte);
      b.classList.toggle("ouverte", ouverte);
      b.setAttribute("aria-disabled", ouvrable ? "false" : "true");
      var etat = !ouvrable
        ? "verrouillée jusqu'au " + formatDate.format(dateOuverture(jour))
        : (ouverte ? "déjà ouverte" : "disponible");
      b.setAttribute("aria-label", "Porte " + jour + ", " + etat);
    }
  }

  /* ---------- Messages ---------- */
  var minuteurToast;
  function message(texte) {
    toast.textContent = texte;
    toast.classList.add("visible");
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(function () { toast.classList.remove("visible"); }, 3200);
  }

  /* ---------- Clic sur une porte ---------- */
  var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function cliquer(jour) {
    var b = boutons[jour];
    if (!estOuvrable(jour)) {
      b.classList.remove("secoue");
      void b.offsetWidth; // relance l'animation
      b.classList.add("secoue");
      message("Pas encore ! La porte " + jour + " s'ouvre le " + formatDate.format(dateOuverture(jour)) + ".");
      return;
    }
    var premiere = dejaOuvertes.indexOf(jour) === -1;
    memoriser(jour);
    b.classList.add("ouverte");
    b.classList.remove("dispo");
    b.setAttribute("aria-label", "Porte " + jour + ", déjà ouverte");
    if (premiere && !reduit) setTimeout(function () { afficher(jour); }, 450);
    else afficher(jour);
  }

  /* ---------- Fenêtre de contenu ---------- */
  function afficher(jour) {
    // Sécurité : on revérifie la date juste avant d'afficher.
    if (!estOuvrable(jour)) return;
    var d = JOURS[jour - 1] || {};
    var corps = document.getElementById("modal-corps");
    document.getElementById("modal-jour").textContent = "Jour " + jour;
    document.getElementById("modal-titre").textContent = d.titre || ("Surprise du jour " + jour);
    corps.replaceChildren();

    if (d.image) {
      var img = document.createElement("img");
      img.src = d.image; img.alt = d.alt || ""; img.loading = "lazy";
      corps.appendChild(img);
    }
    if (d.video) {
      var f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(d.video);
      f.title = d.titre || "Vidéo";
      f.allow = "accelerometer; encrypted-media; gyroscope; picture-in-picture";
      f.allowFullscreen = true;
      f.loading = "lazy";
      corps.appendChild(f);
    }
    if (d.texte) {
      var para = document.createElement("p");
      para.textContent = d.texte;
      corps.appendChild(para);
    }
    if (d.lien && d.lien.url && /^https?:\/\//i.test(d.lien.url)) {
      var a = document.createElement("a");
      a.className = "lien";
      a.href = d.lien.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = d.lien.texte || "Ouvrir";
      corps.appendChild(a);
    }
    if (typeof modal.showModal === "function") modal.showModal();
    else modal.setAttribute("open", "");
  }

  document.getElementById("fermer").addEventListener("click", function () { modal.close(); });
  modal.addEventListener("click", function (e) { if (e.target === modal) modal.close(); }); // clic hors de la carte
  modal.addEventListener("close", function () { document.getElementById("modal-corps").replaceChildren(); });

  /* ---------- Compte à rebours ---------- */
  function deuxChiffres(n) { return (n < 10 ? "0" : "") + n; }
  var dernierNbOuvrables = -1;

  function tic() {
    var nb = 0;
    for (var j = 1; j <= NB; j++) if (estOuvrable(j)) nb++;
    if (nb !== dernierNbOuvrables) { dernierNbOuvrables = nb; majEtats(); }

    if (nb >= NB) {
      compte.textContent = "Toutes les portes sont ouvertes. Joyeux Noël !";
      return;
    }
    var prochain = nb + 1;
    var reste = dateOuverture(prochain).getTime() - maintenant().getTime();
    var s = Math.max(0, Math.floor(reste / 1000));
    var jours = Math.floor(s / 86400);
    var h = Math.floor((s % 86400) / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    var duree = (jours > 0 ? jours + " j " : "") + deuxChiffres(h) + " h " + deuxChiffres(m) + " min " + deuxChiffres(sec) + " s";
    compte.textContent = "Prochaine porte (" + prochain + ") dans " + duree;
  }
  tic();
  setInterval(tic, 1000);

  /* ---------- Neige (décorative, désactivée si mouvement réduit) ---------- */
  var canvas = document.getElementById("neige");
  var ctx = (canvas.getContext && !reduit) ? canvas.getContext("2d") : null;
  if (ctx) {
    var L = 0, H = 0, flocons = [];
    function dimension() {
      var ratio = Math.min(window.devicePixelRatio || 1, 2);
      L = window.innerWidth; H = window.innerHeight;
      canvas.width = L * ratio; canvas.height = H * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }
    dimension();
    window.addEventListener("resize", dimension);
    var total = L < 600 ? 45 : 85;
    for (var n = 0; n < total; n++) {
      flocons.push({ x: Math.random() * L, y: Math.random() * H, r: Math.random() * 2.2 + .6,
                     v: Math.random() * .7 + .3, d: Math.random() * Math.PI * 2 });
    }
    (function dessiner() {
      if (!document.hidden) {
        ctx.clearRect(0, 0, L, H);
        ctx.fillStyle = "rgba(255,255,255,.75)";
        flocons.forEach(function (f) {
          f.y += f.v; f.d += .01; f.x += Math.sin(f.d) * .35;
          if (f.y > H + 5) { f.y = -5; f.x = Math.random() * L; }
          ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
        });
      }
      requestAnimationFrame(dessiner);
    })();
  }
})();
</script>
